<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raj Lab Survey</title>
  <style>
    :root {
      --navy: #052049;
      --navy-hover: #0a2b5e;
      --label: #1d1d1f;
      --secondary: #6e6e73;
      --tertiary: #86868b;
      --fill: rgba(118, 118, 128, .12);
      --glow: 120, 205, 255; /* icy blue light under the chosen answer */
      --blueprint: #1f5fa8;
      --hairline: rgba(0, 0, 0, .08);
      --bg: #ffffff;
      --card: #ffffff;
      --ease: cubic-bezier(.25, .1, .25, 1);
      --ease-out: cubic-bezier(.2, .8, .2, 1);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
              "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--label);
      font-family: var(--font);
      line-height: 1.47;
      letter-spacing: -.01em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ---------- Header: frosted glass bar ---------- */

    .site-header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255, 255, 255, .72);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--hairline);
    }

    .site-header__inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
    }

    .site-header__logo {
      height: 52px;
      width: auto;
      display: block;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 24px;
    }

    /* ---------- Player ---------- */

    .player {
      /* Width is capped by the viewport height so the whole player fits on
         one screen; --chrome covers the header, question, controls and gaps. */
      --chrome: 292px;
      width: min(100%, calc((100vh - var(--chrome)) * 2237 / 1330));
      width: min(100%, calc((100dvh - var(--chrome)) * 2237 / 1330));
      min-width: min(100%, 320px);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .player__question {
      margin: 0;
      text-align: center;
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -.022em;
      line-height: 1.15;
      color: var(--label);
    }

    .player__image {
      width: 100%;
      aspect-ratio: 2237 / 1330; /* matches the glass brain images */
      background: var(--card);
      border-radius: 3px;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, .03),
        0 2px 4px rgba(0, 0, 0, .03),
        0 12px 40px rgba(0, 0, 0, .07);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--tertiary);
      font-size: .95rem;
      font-weight: 500;
      overflow: hidden;
    }

    /* The end screen sits on the page itself, not on a card. */
    .player__image.is-done {
      background: transparent;
      box-shadow: none;
    }

    .player__image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      transition: opacity .2s var(--ease);
    }

    .player__image img.is-loading { opacity: 0; }

    .player__done {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
      padding: 24px;
    }

    .player__done h3 {
      margin: 0;
      color: var(--label);
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -.02em;
    }

    .player__done p {
      margin: 0;
      color: var(--secondary);
      font-size: 1rem;
    }

    /* Progress bar below the question, with an x/120 label */
    .progress {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .progress__track {
      position: relative;
      flex: 1;
      height: 6px;
      border-radius: 999px;
      background: rgba(118, 118, 128, .12);
    }

    .progress__fill {
      height: 100%;
      width: 0;
      min-width: 6px;
      border-radius: inherit;
      background: var(--blueprint);
      transition: width .6s var(--ease-out);
    }

    .progress__label {
      min-width: 4.5em;
      text-align: right;
      color: var(--secondary);
      font-size: .85rem;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    /* A soft pulse through the whole bar each time you move forward */
    @keyframes bar-pulse {
      0%   { transform: scaleY(1); }
      35%  { transform: scaleY(1.5); }
      100% { transform: scaleY(1); }
    }

    @keyframes fill-pulse {
      0%   { filter: brightness(1); }
      35%  { filter: brightness(1.25); }
      100% { filter: brightness(1); }
    }

    .progress__track.is-pulsing {
      animation: bar-pulse .6s var(--ease-out);
    }

    .progress__track.is-pulsing .progress__fill {
      animation: fill-pulse .6s var(--ease-out);
    }

    /* Choices centered, Next pinned right, all on one row */
    .player__controls {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
    }

    /* ---------- Segmented control (Top / Bottom) ---------- */

    /* A pane of glass; a soft blue light sits beneath whichever answer is
       chosen and diffuses up through it. */
    .segmented {
      grid-column: 2;
      position: relative;
      isolation: isolate;
      display: flex;
      gap: 2px;
      padding: 3px;
      border-radius: 999px;
      background: var(--fill);
      overflow: hidden; /* the light stays inside the glass */
    }

    /* The glass surface, above the light and below the labels. */
    .segmented::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(255, 255, 255, .45), rgba(255, 255, 255, .08));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .8),
        inset 0 0 0 1px rgba(0, 0, 0, .04);
    }

    /* Tracks the chosen option; the glow itself is the blurred ::before. */
    .segmented__light {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0;
      transition:
        left .45s var(--ease-out),
        width .45s var(--ease-out),
        opacity .4s var(--ease);
    }

    .segmented__light::before {
      content: "";
      position: absolute;
      inset: -10% 4% -60% 4%;
      border-radius: 50%;
      background: radial-gradient(closest-side,
        rgba(var(--glow), .6),
        rgba(var(--glow), .28) 50%,
        rgba(var(--glow), 0));
      filter: blur(6px);
    }

    .segmented.has-choice .segmented__light { opacity: 1; }

    .segmented__option {
      position: relative;
      min-width: 112px;
      padding: 8px 22px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--label);
      font: inherit;
      font-size: .95rem;
      font-weight: 500;
      letter-spacing: -.01em;
      cursor: pointer;
      transition:
        background-color .25s var(--ease),
        color .25s var(--ease),
        box-shadow .25s var(--ease),
        transform .3s var(--ease-out),
        translate .35s var(--ease-out);
    }

    .segmented__option:hover {
      background: rgba(255, 255, 255, .5);
    }

    .segmented__option[aria-pressed="true"],
    .segmented__option[aria-pressed="true"]:hover {
      color: #0b6aa8;
      background: transparent;
    }

    .segmented__option:active {
      transform: scale(.96);
      transition-duration: .08s;
    }

    /* ---------- Next (pill) ---------- */

    .pill {
      grid-column: 3;
      justify-self: end;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px 10px 22px;
      border: 0;
      border-radius: 999px;
      background: var(--navy);
      color: #fff;
      font: inherit;
      font-size: .95rem;
      font-weight: 500;
      letter-spacing: -.01em;
      cursor: pointer;
      transition:
        background-color .25s var(--ease),
        box-shadow .3s var(--ease),
        transform .3s var(--ease-out),
        translate .35s var(--ease-out);
    }

    .pill svg {
      width: 8px;
      height: 13px;
      transition: transform .3s var(--ease-out);
    }

    .pill:hover {
      background: var(--navy-hover);
      transform: scale(1.02);
      box-shadow: 0 4px 12px rgba(5, 32, 73, .16);
    }

    .pill:active {
      transform: scale(.97);
      box-shadow: 0 2px 6px rgba(5, 32, 73, .18);
      transition-duration: .08s;
    }

    .segmented__option:focus-visible,
    /* Standalone glass button, same material as the Top/Bottom control */
    .glass-btn {
      position: relative;
      isolation: isolate;
      padding: 10px 28px;
      border: 0;
      border-radius: 999px;
      background: var(--fill);
      color: var(--label);
      font: inherit;
      font-size: .95rem;
      font-weight: 500;
      letter-spacing: -.01em;
      cursor: pointer;
      transition:
        background-color .25s var(--ease),
        transform .3s var(--ease-out),
        translate .35s var(--ease-out);
    }

    .glass-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(255, 255, 255, .45), rgba(255, 255, 255, .08));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .8),
        inset 0 0 0 1px rgba(0, 0, 0, .04);
    }

    .glass-btn:hover { background: rgba(118, 118, 128, .16); }

    .glass-btn:active {
      transform: scale(.96);
      transition-duration: .08s;
    }

    .glass-btn:focus-visible {
      outline: 3px solid rgba(0, 113, 227, .6);
      outline-offset: 2px;
    }

    .pill:disabled {
      opacity: .35;
      cursor: default;
      transform: none;
      box-shadow: none;
      background: var(--navy);
    }

    .pill:focus-visible {
      outline: 3px solid rgba(0, 113, 227, .6);
      outline-offset: 2px;
    }

    /* Inside the clipped glass, so draw the ring inward. */
    .segmented__option:focus-visible { outline-offset: -3px; }

    /* ---------- Entrance ---------- */

    @keyframes rise {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: none; }
    }

    .player > * {
      animation: rise .45s var(--ease-out) both;
    }
    .player > :nth-child(2) { animation-delay: .04s; }
    .player > :nth-child(3) { animation-delay: .08s; }
    .player > :nth-child(4) { animation-delay: .12s; }

    /* ---------- Custom cursor (mouse/trackpad only) ---------- */

    .has-custom-cursor,
    .has-custom-cursor * {
      cursor: none !important;
    }

    .cursor {
      --gx: 50%;
      --gy: 50%;
      position: fixed;
      left: 0;
      top: 0;
      z-index: 1000;
      pointer-events: none;
      opacity: 0;
      transform-origin: center;
      will-change: transform, width, height;
      transition:
        opacity .25s var(--ease),
        background-color .3s var(--ease),
        box-shadow .3s var(--ease);
    }

    .cursor.is-visible { opacity: 1; }

    /* Default: a soft grey dot, like iPadOS */
    .cursor--dot {
      background: rgba(60, 60, 67, .42);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .5);
    }

    /* Over a light control: a translucent shape behind the label,
       with a soft sheen that follows the pointer. */
    .cursor--highlight {
      background:
        radial-gradient(circle at var(--gx) var(--gy), rgba(255, 255, 255, .3), rgba(255, 255, 255, 0) 70%),
        rgba(60, 60, 67, .09);
    }

    /* Over a filled control: the button lifts and the cursor becomes a
       light sheen on top of it. */
    .cursor--lift {
      background:
        radial-gradient(circle at var(--gx) var(--gy), rgba(255, 255, 255, .12), rgba(255, 255, 255, 0) 65%);
    }

    /* Over the image: liquid-glass magnifier */
    .cursor--lens {
      background: var(--card);
      box-shadow:
        0 0 0 .5px rgba(0, 0, 0, .12),
        0 4px 10px rgba(0, 0, 0, .08),
        0 18px 40px rgba(0, 0, 0, .16);
    }

    .cursor__lens {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      overflow: hidden;
      opacity: 0;
      transition: opacity .2s var(--ease);
    }

    .cursor--lens .cursor__lens { opacity: 1; }

    .cursor__lens-content {
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: 0 0;
    }

    /* Glass: a bright crescent along the top edge, a thin specular rim,
       and a faint darkening toward the edge where the glass thickens. */
    .cursor__lens::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background:
        radial-gradient(100% 55% at 50% 0%, rgba(255, 255, 255, .3), rgba(255, 255, 255, 0) 60%),
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0) 70%, rgba(0, 0, 0, .06) 100%);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, .95),
        inset 0 0 0 1px rgba(255, 255, 255, .35),
        inset 0 -10px 20px rgba(0, 0, 0, .05);
    }

    /* ---------- Finish splash: blue sweeps out from Finish, a check
       draws itself, then it clears to reveal the end screen ---------- */

    .splash {
      --sx: 50%;
      --sy: 50%;
      position: fixed;
      inset: 0;
      z-index: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--blueprint);
      clip-path: circle(0px at var(--sx) var(--sy));
      transition:
        clip-path .6s cubic-bezier(.65, 0, .35, 1),
        opacity .5s var(--ease);
    }

    .splash.is-expanding { clip-path: circle(150vmax at var(--sx) var(--sy)); }
    .splash.is-leaving { opacity: 0; }

    .splash__inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      color: #fff;
      transition: transform .5s var(--ease);
    }

    .splash.is-leaving .splash__inner { transform: scale(1.04); }

    .splash__check {
      width: 96px;
      height: 96px;
    }

    .splash__check circle {
      fill: none;
      stroke: rgba(255, 255, 255, .3);
      stroke-width: 3;
    }

    .splash__check path {
      fill: none;
      stroke: #fff;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
      transition: stroke-dashoffset .45s var(--ease-out);
    }

    .splash.is-content .splash__check path { stroke-dashoffset: 0; }

    .splash__text {
      margin: 0;
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -.02em;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .4s .2s var(--ease), transform .4s .2s var(--ease-out);
    }

    .splash.is-content .splash__text { opacity: 1; transform: none; }

    @media (prefers-reduced-motion: reduce) {
      .splash { clip-path: none; opacity: 0; transition: opacity .25s var(--ease); }
      .splash.is-expanding { opacity: 1; }
      .splash.is-leaving { opacity: 0; }
      .splash__check path, .splash__text, .splash__inner { transition: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .player > * { animation: none; }
      .segmented__option, .pill, .pill svg { transition: background-color .2s var(--ease); }
      .segmented__light, .progress__fill { transition: none; }
      .progress__track.is-pulsing { animation: none; }
      .pill:hover, .pill:active, .segmented__option:active, .glass-btn:active { transform: none; }
    }

    @media (max-width: 560px) {
      .player__question { font-size: 1.4rem; }
      .player__controls { grid-template-columns: 1fr; justify-items: center; }
      .segmented, .pill { grid-column: 1; }
      .pill { justify-self: center; }
      .segmented__option { min-width: 96px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <img class="site-header__logo" src="UCSF_Sig_21_Navy_300dpi_RGB.png" alt="UCSF – University of California San Francisco">
    </div>
  </header>

  <main>
    <section class="player">
      <h2 class="player__question">Which is AI-generated?</h2>

      <div class="progress">
        <div class="progress__track" id="progress" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="120" aria-valuenow="0">
          <div class="progress__fill" id="progress-fill"></div>
        </div>
        <span class="progress__label" id="progress-label" aria-hidden="true"></span>
      </div>

      <div class="player__image" id="player-image">
        <img id="scan" class="is-loading" alt="Glass brain views of tau PET in two rows, one scanner-acquired and one AI-generated">
      </div>

      <div class="player__controls">
        <div class="segmented" id="choices" role="group" aria-label="Your answer">
          <span class="segmented__light" id="choice-light" aria-hidden="true"></span>
          <button type="button" class="segmented__option" id="choose-top" aria-pressed="false" data-cursor="highlight">Top</button>
          <button type="button" class="segmented__option" id="choose-bottom" aria-pressed="false" data-cursor="highlight">Bottom</button>
        </div>
        <button type="button" class="pill" id="next" data-cursor="lift" disabled>
          <span id="next-label">Next</span>
          <svg viewBox="0 0 8 13" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </section>
  </main>

  <div class="splash" id="splash" aria-hidden="true" hidden>
    <div class="splash__inner">
      <svg class="splash__check" viewBox="0 0 96 96">
        <circle cx="48" cy="48" r="45"/>
        <path d="M30 49l12 12 24-26"/>
      </svg>
      <p class="splash__text">120 cases complete</p>
    </div>
  </div>

  <div class="cursor cursor--dot" id="cursor" aria-hidden="true">
    <div class="cursor__lens"><div class="cursor__lens-content" id="lens-content"></div></div>
  </div>

  <script>
    // Every patient, shown once each in a fresh random order per visit.
    (function () {
      var RIDS = [21,120,337,555,679,680,1190,1261,2121,2183,2234,2403,4028,4090,4200,4212,4213,4262,4335,4469,4580,4598,4607,4637,4644,4706,4721,4813,4827,4855,4872,5126,5154,5169,5265,6016,6038,6045,6062,6065,6072,6113,6133,6142,6144,6147,6186,6199,6209,6228,6231,6237,6244,6264,6284,6288,6306,6312,6314,6349,6356,6358,6374,6394,6396,6404,6422,6426,6428,6429,6437,6467,6476,6483,6487,6494,6498,6503,6521,6549,6559,6564,6566,6580,6581,6589,6606,6634,6635,6679,6704,6719,6734,6735,6742,6770,6771,6803,6810,6825,6834,6845,6846,6883,6886,6914,6918,6925,6943,6958,6965,6987,6996,6999,7001,7004,7013,7015,7020,7054];
      var IMAGE_DIR = 'output_glassbrain_slices';

      var scan = document.getElementById('scan');
      var imageBox = document.getElementById('player-image');
      var progress = document.getElementById('progress');
      var progressFill = document.getElementById('progress-fill');
      var progressLabel = document.getElementById('progress-label');

      function pulse() {
        progress.classList.remove('is-pulsing');
        progress.offsetWidth; // restart the animation
        progress.classList.add('is-pulsing');
      }

      // Fills as cases are seen: the first case shows a sliver, the last a full bar.
      function setProgress(seen) {
        progressFill.style.width = (seen / order.length * 100) + '%';
        progress.setAttribute('aria-valuenow', seen);
        progress.setAttribute('aria-valuetext', seen + ' of ' + order.length);
        progressLabel.textContent = seen + '/' + order.length;
      }
      var nextBtn = document.getElementById('next');
      var nextLabel = document.getElementById('next-label');
      var choices = document.getElementById('choices');
      var light = document.getElementById('choice-light');
      var options = choices.querySelectorAll('.segmented__option');
      var chosen = null;

      function placeLight() {
        if (!chosen) return;
        light.style.left = chosen.offsetLeft + 'px';
        light.style.width = chosen.offsetWidth + 'px';
      }

      function choose(btn) {
        // First choice: put the light in place before it fades in, so it
        // appears under the answer instead of sliding in from the edge.
        if (!chosen) {
          light.style.transition = 'none';
          chosen = btn;
          placeLight();
          light.offsetWidth;
          light.style.transition = '';
        }
        chosen = btn;
        options.forEach(function (o) { o.setAttribute('aria-pressed', String(o === btn)); });
        choices.classList.add('has-choice');
        placeLight();
        answers[order[index]] = btn.id === 'choose-top' ? 'top' : 'bottom';
        nextBtn.disabled = false;
      }

      function clearChoice() {
        chosen = null;
        options.forEach(function (o) { o.setAttribute('aria-pressed', 'false'); });
        choices.classList.remove('has-choice');
        nextBtn.disabled = true;
      }

      options.forEach(function (o) {
        o.addEventListener('click', function () { choose(o); });
      });
      window.addEventListener('resize', placeLight);

      function imageFor(rid) {
        return IMAGE_DIR + '/RID_' + rid + '/voxel_tau_glass_brain_RID_' + rid + '.png';
      }

      // Fisher–Yates shuffle.
      var order = RIDS.slice();
      for (var i = order.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = order[i]; order[i] = order[j]; order[j] = t;
      }

      var index = 0;
      var answers = {};   // rid -> 'top' | 'bottom' (the row picked as AI-generated)
      var downloaded = false;

      function show() {
        var src = imageFor(order[index]);
        scan.classList.add('is-loading');
        var img = new Image();
        img.onload = img.onerror = function () {
          scan.src = src;
          scan.classList.remove('is-loading');
        };
        img.src = src;
        setProgress(index + 1);
        clearChoice();
        nextLabel.textContent = index === order.length - 1 ? 'Finish' : 'Next';

        // Warm the cache so the next one appears instantly.
        if (index + 1 < order.length) new Image().src = imageFor(order[index + 1]);
      }

      // One row per patient, sorted by ID: rid, the row picked as AI-generated.
      function resultsCsv() {
        var rows = RIDS.slice().sort(function (a, b) { return a - b; }).map(function (rid) {
          return rid + ',' + (answers[rid] || '');
        });
        return 'rid,prediction_position\n' + rows.join('\n') + '\n';
      }

      function downloadCsv() {
        var now = new Date();
        var stamp = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' +
          String(now.getDate()).padStart(2, '0') + '_' + String(now.getHours()).padStart(2, '0') +
          String(now.getMinutes()).padStart(2, '0');
        var url = URL.createObjectURL(new Blob([resultsCsv()], { type: 'text/csv' }));
        var a = document.createElement('a');
        a.href = url;
        a.download = 'ai_or_real_answers_' + stamp + '.csv';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        downloaded = true;
      }

      function finish() {
        setProgress(order.length);
        choices.hidden = true;
        nextBtn.hidden = true;
        imageBox.classList.add('is-done');
        imageBox.innerHTML =
          '<div class="player__done">' +
            '<h3>You\u2019re all done!</h3>' +
            '<p>Thanks for filling out this survey for the Raj Lab.</p>' +
            '<button type="button" class="glass-btn" id="download" data-cursor="highlight">Download</button>' +
          '</div>';
        document.getElementById('download').addEventListener('click', downloadCsv);
      }

      // Blue sweeps out from the Finish button, a check draws itself, and
      // the end screen is swapped in underneath before the splash clears.
      function playSplash(fromEl, done) {
        var splash = document.getElementById('splash');
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (fromEl) {
          var r = fromEl.getBoundingClientRect();
          splash.style.setProperty('--sx', (r.left + r.width / 2) + 'px');
          splash.style.setProperty('--sy', (r.top + r.height / 2) + 'px');
        }
        splash.hidden = false;
        splash.offsetWidth; // start from the collapsed state
        splash.classList.add('is-expanding');

        setTimeout(function () { splash.classList.add('is-content'); }, reduce ? 0 : 350);
        setTimeout(done, reduce ? 250 : 600);
        setTimeout(function () { splash.classList.add('is-leaving'); }, reduce ? 1200 : 1750);
        setTimeout(function () {
          splash.hidden = true;
          splash.className = 'splash';
        }, reduce ? 1500 : 2300);
      }

      // Warn before leaving without the CSV, since answers live only in this tab.
      window.addEventListener('beforeunload', function (e) {
        if (!downloaded && Object.keys(answers).length > 0) {
          e.preventDefault();
          e.returnValue = '';
        }
      });

      nextBtn.addEventListener('click', function () {
        if (!chosen) return;
        pulse();
        index++;
        if (index < order.length) show(); else playSplash(nextBtn, finish);
      });

      show();
    })();
  </script>

  <script>
    (function () {
      // Only for real pointers; touch devices keep their normal behavior.
      if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;

      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var cursor = document.getElementById('cursor');
      var lensContent = document.getElementById('lens-content');
      var imageBox = document.getElementById('player-image');

      var DOT = 16;          // dot diameter
      var LENS = 190;        // magnifier diameter
      var ZOOM = 2.2;        // magnification
      var PAD = 3;           // highlight padding around light controls
      var MAGNET = 0.05;     // how far controls lean toward the pointer

      // Critically-ish damped springs: position settles cleanly, size has
      // just a hint of overshoot.
      function spring(value, k, d) { return { x: value, v: 0, target: value, k: k, d: d }; }
      function step(s) {
        if (reduceMotion) { s.x = s.target; s.v = 0; return; }
        s.v = (s.v + (s.target - s.x) * s.k) * s.d;
        s.x += s.v;
      }

      var px = spring(-100, 0.3, 0.6), py = spring(-100, 0.3, 0.6);
      var w = spring(DOT, 0.14, 0.66), h = spring(DOT, 0.14, 0.66);
      var r = spring(DOT / 2, 0.14, 0.66);

      var mouse = { x: -100, y: -100 };
      var mode = 'dot';
      var activeEl = null;
      var elRect = null;
      var elRadius = 0;

      document.documentElement.classList.add('has-custom-cursor');

      function measure(el) {
        el.style.translate = '';
        elRect = el.getBoundingClientRect();
        elRadius = Math.min(parseFloat(getComputedStyle(el).borderRadius) || 0, elRect.height / 2);
      }

      function setMode(next, el) {
        if (activeEl && activeEl !== el) activeEl.style.translate = '';
        activeEl = el || null;
        if (activeEl) measure(activeEl);
        if (next === 'lens' && mode !== 'lens') {
          // Magnify a live copy of whatever is in the image box.
          var rect = imageBox.getBoundingClientRect();
          var copy = imageBox.cloneNode(true);
          copy.removeAttribute('id');
          copy.style.width = rect.width + 'px';
          copy.style.height = rect.height + 'px';
          copy.style.animation = 'none';
          lensContent.replaceChildren(copy);
        }
        mode = next;
        cursor.className = 'cursor cursor--' + next + ' is-visible';
      }

      document.addEventListener('pointermove', function (e) {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        cursor.classList.add('is-visible');

        var control = e.target.closest('[data-cursor]:not(:disabled)');
        if (control) {
          if (control !== activeEl) setMode(control.dataset.cursor, control);
        } else if (e.target.closest('#player-image:not(.is-done)')) {
          if (mode !== 'lens') setMode('lens');
        } else if (mode !== 'dot') {
          setMode('dot');
        }
      });

      document.documentElement.addEventListener('mouseleave', function () {
        cursor.classList.remove('is-visible');
      });

      // A gentle press on click.
      document.addEventListener('pointerdown', function () {
        if (reduceMotion) return;
        var big = mode === 'highlight' || mode === 'lift';
        w.v -= big ? 4 : 2;
        h.v -= big ? 3 : 2;
      });

      window.addEventListener('resize', function () {
        if (activeEl) measure(activeEl);
        if (mode === 'lens') { mode = 'dot'; setMode('lens'); }
      });

      function frame() {
        // A control that became disabled or hidden under the pointer lets go.
        if (activeEl && (activeEl.disabled || !activeEl.isConnected || activeEl.closest('[hidden]'))) {
          setMode('dot');
        }
        var onControl = (mode === 'highlight' || mode === 'lift') && elRect;

        if (onControl) {
          var pad = mode === 'lift' ? 0 : PAD;
          var cx = elRect.left + elRect.width / 2;
          var cy = elRect.top + elRect.height / 2;
          var ox = (mouse.x - cx) * MAGNET;
          var oy = (mouse.y - cy) * MAGNET * 1.4;
          if (!reduceMotion) activeEl.style.translate = ox + 'px ' + oy + 'px';
          px.target = cx + ox;
          py.target = cy + oy;
          w.target = elRect.width + pad * 2;
          h.target = elRect.height + pad * 2;
          r.target = elRadius + pad;
        } else if (mode === 'lens') {
          px.target = mouse.x;
          py.target = mouse.y;
          w.target = h.target = LENS;
          r.target = LENS / 2;
        } else {
          px.target = mouse.x;
          py.target = mouse.y;
          w.target = h.target = DOT;
          r.target = DOT / 2;
        }

        // The lens tracks the pointer tightly so the zoomed spot is accurate.
        px.k = py.k = mode === 'lens' ? 0.5 : 0.3;

        step(px); step(py); step(w); step(h); step(r);

        var cw = Math.max(w.x, 2), ch = Math.max(h.x, 2);
        var transform = 'translate(' + (px.x - cw / 2) + 'px,' + (py.x - ch / 2) + 'px)';

        // The lifted control scales with the cursor, so they move as one.
        if (mode === 'lift' && !reduceMotion) transform += ' scale(1.02)';

        cursor.style.width = cw + 'px';
        cursor.style.height = ch + 'px';
        cursor.style.borderRadius = Math.min(r.x, cw / 2, ch / 2) + 'px';
        cursor.style.transform = transform;

        if (onControl) {
          // Sheen position, relative to the cursor shape.
          cursor.style.setProperty('--gx', (mouse.x - (px.x - cw / 2)) + 'px');
          cursor.style.setProperty('--gy', (mouse.y - (py.x - ch / 2)) + 'px');
        }

        if (mode === 'lens') {
          var rect = imageBox.getBoundingClientRect();
          var lx = (px.x - rect.left) * ZOOM;
          var ly = (py.x - rect.top) * ZOOM;
          lensContent.style.transform =
            'translate(' + (cw / 2 - lx) + 'px,' + (ch / 2 - ly) + 'px) scale(' + ZOOM + ')';
        }

        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
